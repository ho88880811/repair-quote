<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機維修報價查詢</title>
<style>
  :root {
    --bg: #eef1ef;
    --surface: #ffffff;
    --surface-alt: #e4e8e5;
    --text: #1a211e;
    --text-muted: #5c665f;
    --border: #d7dcd8;
    --accent: #b5652e;
    --accent-ink: #ffffff;
    --accent-soft: rgba(181, 101, 46, 0.1);
    --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 8px 24px -12px rgba(20, 30, 25, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14191a; --surface: #1d2325; --surface-alt: #252b2d;
      --text: #e9eeea; --text-muted: #93a099; --border: #333b3d;
      --accent: #e08a46; --accent-ink: #1a1210; --accent-soft: rgba(224, 138, 70, 0.14);
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14191a; --surface: #1d2325; --surface-alt: #252b2d;
    --text: #e9eeea; --text-muted: #93a099; --border: #333b3d;
    --accent: #e08a46; --accent-ink: #1a1210; --accent-soft: rgba(224, 138, 70, 0.14);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .num { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
  header.page-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: 22px; }
  header.page-head .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--accent); font-weight: 700; text-transform: uppercase; }
  header.page-head h1 { margin: 0; font-size: 24px; font-weight: 700; text-wrap: balance; }
  header.page-head p { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .status-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; font-size: 12px; color: var(--text-muted); }
  .status-bar button {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .status-bar button:hover { border-color: var(--accent); color: var(--accent); }
  .status-bar button:disabled { opacity: .5; cursor: default; }
  .brand-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 14px; }
  .brand-tab {
    flex: none; appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
    font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s; font-family: inherit; white-space: nowrap;
  }
  .brand-tab:hover { border-color: var(--accent); }
  .brand-tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .search-box { position: relative; margin-bottom: 10px; }
  .search-box input {
    width: 100%; font-family: inherit; font-size: 16px; padding: 13px 42px 13px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-box svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted); pointer-events: none; }
  .model-count { font-size: 12px; color: var(--text-muted); margin: 0 2px 10px; }
  .model-list {
    list-style: none; margin: 0 0 4px; padding: 0; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); max-height: 340px; overflow-y: auto; box-shadow: var(--shadow);
  }
  .model-list li + li { border-top: 1px solid var(--border); }
  .model-list button {
    appearance: none; background: none; border: none; width: 100%; text-align: left; padding: 12px 16px;
    font-family: inherit; font-size: 14.5px; color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .model-list button:hover, .model-list button:focus-visible { background: var(--accent-soft); }
  .model-list .badges { display: flex; gap: 4px; flex: none; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .dot.on { background: var(--accent); }
  .part-count { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
  .empty-state, .loading-state, .error-state { padding: 34px 16px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .error-state { color: #b8452e; }
  .result { margin-top: 22px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; display: none; }
  .result.show { display: block; }
  .result-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .result-head .name { font-size: 18px; font-weight: 700; letter-spacing: .01em; }
  .result-head .brand-pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .parts { display: grid; gap: 1px; background: var(--border); }
  .part-row { background: var(--surface); padding: 16px 20px; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .part-row .info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .part-row .label { font-size: 13.5px; font-weight: 600; color: var(--text-muted); }
  .part-row .spec { font-size: 12px; color: var(--text-muted); opacity: .8; }
  .part-row .quote { flex: none; font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1.3; white-space: nowrap; }
  .part-row.missing { opacity: .45; }
  .part-row.missing .quote { font-size: 14px; color: var(--text-muted); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .warranty, .repair-time { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; width: fit-content; }
  .warranty.covered { color: var(--accent); background: var(--accent-soft); }
  .warranty.none { color: #b8452e; background: rgba(184, 69, 46, 0.1); }
  .repair-time { color: var(--text-muted); background: var(--surface-alt); }
  .part-note { font-size: 11.5px; color: #a3690f; margin-top: 3px; line-height: 1.4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .part-note { color: #e0ac46; } }
  :root[data-theme="dark"] .part-note { color: #e0ac46; }
  .result-foot { padding: 12px 20px 16px; font-size: 11.5px; color: var(--text-muted); line-height: 1.6; }
  footer.page-foot { margin-top: 26px; font-size: 11.5px; color: var(--text-muted); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 14px; }
  @media (max-width: 480px) { .wrap { padding: 20px 14px 48px; } header.page-head h1 { font-size: 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <span class="eyebrow">維修零件報價查詢</span>
    <h1>手機維修報價查詢</h1>
    <p>iPhone／三星／OPPO／VIVO／小米／紅米。資料即時讀取自 Google 試算表。</p>
  </header>

  <div class="status-bar">
    <span id="syncStatus">讀取中…</span>
    <button id="refreshBtn" type="button">重新整理資料</button>
  </div>

  <div class="brand-tabs" role="tablist" id="brandTabs"></div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="輸入型號搜尋，例如 iPhone13、S24、Reno12、Note13" autocomplete="off" disabled />
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
  </div>

  <p class="model-count" id="modelCount"></p>
  <ul class="model-list" id="modelList"><li><div class="loading-state">正在從 Google 試算表載入資料…</div></li></ul>

  <div class="result" id="result">
    <div class="result-head">
      <span class="name" id="resultName"></span>
      <span class="brand-pill" id="resultBrand"></span>
    </div>
    <div class="parts" id="resultParts"></div>
    <div class="result-foot">僅供參考，實際報價請依當下行情與機況調整。<br>維修保固90天（背玻璃／後殼／鏡頭玻璃等外觀件不含保固，因其多為外力或跌落造成，非自然故障）。<br>保固不含泡水、人為摔損、自行拆修等情況。</div>
  </div>

  <footer class="page-foot">
    皆僅供參考，實際報價請依當下行情與機況調整。維修保固90天，外觀件（背玻璃／後殼／鏡頭玻璃）不含保固。
  </footer>
</div>

<script>
  // ===== 設定：Google 試算表 ID 與各品牌分頁的 gid（Android／iPhone 現在合併在同一份試算表）=====
  const ANDROID_SHEET_ID = "1IDOVG-py6Z02CZUpdnq-H-pvPRJCoHlu8rQkkKwERRE";
  const BRANDS_CONFIG = {
    "iPhone": { kind: "iphone", sheetId: ANDROID_SHEET_ID, gid: "533321848" },
    "三星": { kind: "android", sheetId: ANDROID_SHEET_ID, gid: "545222408" },
    "OPPO": { kind: "android", sheetId: ANDROID_SHEET_ID, gid: "302173125" },
    "VIVO": { kind: "android", sheetId: ANDROID_SHEET_ID, gid: "1747588530" },
    "小米": { kind: "android", sheetId: ANDROID_SHEET_ID, gid: "1927691296" },
    "紅米": { kind: "android", sheetId: ANDROID_SHEET_ID, gid: "1364731295" },
  };
  const BRANDS = Object.keys(BRANDS_CONFIG);
  const PART_LABELS = { screen: "總成（螢幕）", battery: "電池", tailplug: "尾插排線" };

  // ===== 保固規則 =====
  // 有功能性的零件（螢幕、電池、尾插排線、鏡頭、喇叭聽筒、排線等）保固90天；
  // 外觀件（背玻璃、後殼、鏡頭玻璃）不易自然故障、多為外力/跌落造成，故不提供保固。
  // 少數項目保固天數不同於預設值（例如螢幕玻璃只保固30天），列在 WARRANTY_OVERRIDE_DAYS。
  const WARRANTY_DAYS = 90;
  const NO_WARRANTY_KEYWORDS = ["背玻璃", "後殼", "鏡頭玻璃"];
  const WARRANTY_OVERRIDE_DAYS = { "螢幕玻璃": 30 };
  function isCosmeticPart(label) {
    return NO_WARRANTY_KEYWORDS.some((kw) => label.includes(kw));
  }
  function warrantyLabel(label) {
    if (isCosmeticPart(label)) return { text: "不含保固", cls: "none" };
    const days = WARRANTY_OVERRIDE_DAYS[label] != null ? WARRANTY_OVERRIDE_DAYS[label] : WARRANTY_DAYS;
    return { text: `保固${days}天`, cls: "covered" };
  }

  // ===== 預估維修時間：安卓（三種零件）=====
  const ANDROID_REPAIR_TIME = {
    screen: "約30-90分鐘",
    battery: "約30-60分鐘",
    tailplug: "約30-60分鐘",
  };

  // ===== 預估維修時間：iPhone（依報價表欄名對應）=====
  const IPHONE_REPAIR_TIME = {
    "螢幕（同規格）": "約30-90分鐘",
    "螢幕（副廠）": "約30-90分鐘",
    "螢幕玻璃": "約3-4小時",
    "原廠電池": "約60-120分鐘",
    "副廠電池": "約30-90分鐘",
    "後鏡頭": "約30-60分鐘",
    "前鏡頭": "約30-60分鐘",
    "尾插": "約60-120分鐘",
    "背玻璃": "約60-90分鐘",
    "後殼總成": "約60-120分鐘",
    "震動器": "約30分鐘",
    "喇叭": "約30分鐘",
    "聽筒": "約30分鐘",
    "臉部辨識": "時間請洽詢",
    "開機排線": "約60-90分鐘",
    "音量排線+無線充電": "約60-90分鐘",
    "鏡頭玻璃（單顆）": "約30-60分鐘",
  };

  // ===== iPhone 機型代數判斷（用於零件配對警示）=====
  // 從機型字串抓出數字世代（7,8,11,12...）或特殊型號（X/XR/XS/XSM/SE2/SE3）
  function iphoneGenInfo(model) {
    const m = model.trim();
    if (/SE\s*2/i.test(m)) return { special: "SE2" };
    if (/SE\s*3/i.test(m)) return { special: "SE3" };
    if (/\bXR\b/i.test(m)) return { special: "XR" };
    if (/Xs\s*Max/i.test(m)) return { special: "XSM" };
    if (/Xs\b/i.test(m)) return { special: "XS" };
    const numMatch = m.match(/iphone\s*(\d+)/i);
    if (numMatch) return { gen: parseInt(numMatch[1], 10) };
    if (/iphone\s*x\b/i.test(m)) return { special: "X" };
    return {};
  }

  // ===== 零件配對警示（Apple 原廠/副廠零件配對機制，依機型代數而異）=====
  function iphonePartNote(label, model) {
    const info = iphoneGenInfo(model);
    if (label === "螢幕（同規格）") {
      if (info.gen != null && info.gen >= 11) return "此機型維修後設定內會顯示「未知」或「已使用」提示";
      return null;
    }
    if (label === "螢幕（副廠）") {
      if (info.gen != null && info.gen >= 11) return "此機型維修後設定內會顯示「未知」提示";
      return null;
    }
    if (label === "螢幕玻璃") {
      return "只保觸控功能";
    }
    if (label === "原廠電池") {
      return "維修後顯示為原廠零件";
    }
    if (label === "副廠電池") {
      const warnSet = ["XR", "XS", "XSM", "SE2", "SE3"];
      if (info.gen === 11 || (info.special && warnSet.includes(info.special))) {
        return "此機型維修後設定內會顯示「未知」提示";
      }
      if (info.gen != null && info.gen >= 12) return "此機型維修後設定內會顯示「已使用」提示";
      return null;
    }
    if (label === "後鏡頭") {
      if (info.gen != null && info.gen >= 12) return "此機型維修後設定內會顯示「未知」或「已使用」提示";
      return null;
    }
    return null;
  }

  // combined-sheet 欄位配置（1-indexed → 0-indexed）
  // A=機型, B=總成成本, C=總成建議報價, D=總成規格,
  // E=電池成本, F=電池建議報價, G=電池規格,
  // H=尾插成本, I=尾插建議報價, J=尾插規格
  const COLS = {
    screen:   { cost: 1, quote: 2, spec: 3 },
    battery:  { cost: 4, quote: 5, spec: 6 },
    tailplug: { cost: 7, quote: 8, spec: 9 },
  };

  let DATA = {};              // { brand: [ {model, screen?, battery?, tailplug?}, ... ] }
  let activeBrand = BRANDS[0];
  let query = "";
  let loaded = false;

  const brandTabsEl = document.getElementById("brandTabs");
  const searchInput = document.getElementById("searchInput");
  const modelListEl = document.getElementById("modelList");
  const modelCountEl = document.getElementById("modelCount");
  const resultEl = document.getElementById("result");
  const resultName = document.getElementById("resultName");
  const resultBrand = document.getElementById("resultBrand");
  const resultParts = document.getElementById("resultParts");
  const syncStatusEl = document.getElementById("syncStatus");
  const refreshBtn = document.getElementById("refreshBtn");

  // ---------- CSV parsing (RFC4180-ish) ----------
  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else field += c;
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows;
  }

  function parseNumber(raw) {
    if (raw == null) return null;
    const cleaned = String(raw).replace(/[^0-9.\-]/g, "");
    if (cleaned === "" || cleaned === "-") return null;
    const n = parseFloat(cleaned);
    return Number.isFinite(n) ? n : null;
  }

  // ---------- Model tokenising (mirrors the Python build script) ----------
  function tokenize(model) {
    let m = model.trim();
    if (m.endsWith("(共用)")) m = m.slice(0, -"(共用)".length);
    const parts = m.split("/").map((p) => p.trim()).filter(Boolean);
    return parts.length ? parts : [model.trim()];
  }

  function normKey(m) {
    let s = m.trim().replace(/\s+/g, " ");
    s = s.replace(/\s*\(\s*/g, "(").replace(/\s*\)\s*/g, ")");
    return s.toLowerCase();
  }

  function buildBrandList(rows) {
    // rows: array of arrays (raw CSV rows, rows[0] is header)
    const canonical = {}; // normKey -> { display, screen?, battery?, tailplug? }
    const order = [];

    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const model = (row[0] || "").trim();
      if (!model) continue;

      for (const partKey of Object.keys(COLS)) {
        const c = COLS[partKey];
        const cost = parseNumber(row[c.cost]);
        const quote = parseNumber(row[c.quote]);
        const spec = (row[c.spec] || "").trim();
        if (cost == null && quote == null) continue;

        const tokens = tokenize(model);
        for (const tok of tokens) {
          const nk = normKey(tok);
          if (!canonical[nk]) { canonical[nk] = { display: tok }; order.push(nk); }
          if (!canonical[nk][partKey]) {
            canonical[nk][partKey] = { cost, quote: quote != null ? quote : cost, spec };
          }
        }
      }
    }

    return order
      .sort((a, b) => canonical[a].display.localeCompare(canonical[b].display, "en"))
      .map((nk) => {
        const e = canonical[nk];
        const item = { model: e.display };
        for (const k of Object.keys(COLS)) if (e[k]) item[k] = e[k];
        return item;
      });
  }

  // ---------- iPhone sheet: 每種零件各自一欄，欄名即零件名稱，已是最終報價 ----------
  function buildIphoneList(rows) {
    if (!rows.length) return [];
    const header = rows[0];
    const list = [];
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const model = (row[0] || "").trim();
      if (!model) continue;
      const parts = [];
      for (let c = 1; c < header.length; c++) {
        const label = (header[c] || "").trim();
        if (!label) continue;
        const raw = (row[c] || "").trim();
        if (!raw || raw.toUpperCase() === "X") continue;
        const quote = parseNumber(raw);
        if (quote == null) continue;
        parts.push({ label, quote });
      }
      list.push({ model, parts });
    }
    return list;
  }

  // ---------- Fetching ----------
  function csvUrl(sheetId, gid) {
    return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}&cachebust=${Date.now()}`;
  }

  async function fetchBrand(brand) {
    const cfg = BRANDS_CONFIG[brand];
    const res = await fetch(csvUrl(cfg.sheetId, cfg.gid), { cache: "no-store" });
    if (!res.ok) throw new Error(`${brand} 讀取失敗（HTTP ${res.status}）`);
    const text = await res.text();
    if (/^<!DOCTYPE html/i.test(text.trim())) {
      throw new Error("試算表尚未開放公開檢視，或連結錯誤");
    }
    const rows = parseCSV(text);
    return cfg.kind === "iphone" ? buildIphoneList(rows) : buildBrandList(rows);
  }

  async function loadAll() {
    refreshBtn.disabled = true;
    syncStatusEl.textContent = "讀取中…";
    searchInput.disabled = true;
    modelListEl.innerHTML = '<li><div class="loading-state">正在從 Google 試算表載入資料…</div></li>';

    try {
      const results = await Promise.all(BRANDS.map((b) => fetchBrand(b)));
      BRANDS.forEach((b, i) => { DATA[b] = results[i]; });
      loaded = true;
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      syncStatusEl.textContent = `已同步・更新於 ${hh}:${mm}:${ss}`;
      searchInput.disabled = false;
      renderTabs();
      renderList();
    } catch (err) {
      syncStatusEl.textContent = "讀取失敗";
      modelListEl.innerHTML = `<li><div class="error-state">${(err && err.message) || "無法讀取試算表資料"}<br>請確認試算表已設定「知道連結的人都能檢視」。</div></li>`;
    } finally {
      refreshBtn.disabled = false;
    }
  }

  refreshBtn.addEventListener("click", loadAll);

  // ---------- Rendering ----------
  function renderTabs() {
    brandTabsEl.innerHTML = "";
    BRANDS.forEach((b) => {
      const btn = document.createElement("button");
      btn.className = "brand-tab";
      btn.type = "button";
      btn.role = "tab";
      btn.textContent = b;
      btn.setAttribute("aria-selected", b === activeBrand ? "true" : "false");
      btn.addEventListener("click", () => {
        activeBrand = b;
        resultEl.classList.remove("show");
        renderTabs();
        renderList();
      });
      brandTabsEl.appendChild(btn);
    });
  }

  function fmt(n) { return "NT$" + Math.round(n).toLocaleString("en-US"); }

  function renderList() {
    if (!loaded) return;
    const list = DATA[activeBrand] || [];
    const q = query.trim().toLowerCase();
    const filtered = q ? list.filter((m) => m.model.toLowerCase().includes(q)) : list;

    modelCountEl.textContent = activeBrand + " 共 " + list.length + " 個型號" + (q ? "，符合 " + filtered.length + " 筆" : "");
    modelListEl.innerHTML = "";

    if (filtered.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "找不到符合的型號，換個關鍵字試試";
      modelListEl.appendChild(empty);
      return;
    }

    const kind = BRANDS_CONFIG[activeBrand].kind;
    filtered.slice(0, 200).forEach((item) => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      const nameSpan = document.createElement("span");
      nameSpan.textContent = item.model;
      const badges = document.createElement("span");
      badges.className = "badges";
      if (kind === "android") {
        ["screen", "battery", "tailplug"].forEach((k) => {
          const d = document.createElement("span");
          d.className = "dot" + (item[k] ? " on" : "");
          badges.appendChild(d);
        });
      } else {
        const countSpan = document.createElement("span");
        countSpan.className = "part-count";
        countSpan.textContent = item.parts.length + " 項";
        badges.appendChild(countSpan);
      }
      btn.appendChild(nameSpan);
      btn.appendChild(badges);
      btn.addEventListener("click", () => selectModel(item));
      li.appendChild(btn);
      modelListEl.appendChild(li);
    });
  }

  function partRow(label, data, timeText, noteText) {
    const row = document.createElement("div");
    row.className = "part-row" + (data ? "" : " missing");
    const info = document.createElement("div");
    info.className = "info";
    const labelEl = document.createElement("div");
    labelEl.className = "label";
    labelEl.textContent = label;
    info.appendChild(labelEl);
    if (!data) {
      const spec = document.createElement("div");
      spec.className = "spec";
      spec.textContent = "尚無資料";
      info.appendChild(spec);
    } else {
      const tags = document.createElement("div");
      tags.className = "tags";
      const w = warrantyLabel(label);
      const warrantyEl = document.createElement("span");
      warrantyEl.className = "warranty " + w.cls;
      warrantyEl.textContent = w.text;
      tags.appendChild(warrantyEl);
      if (timeText) {
        const timeEl = document.createElement("span");
        timeEl.className = "repair-time";
        timeEl.textContent = timeText;
        tags.appendChild(timeEl);
      }
      info.appendChild(tags);
      if (noteText) {
        const noteEl = document.createElement("div");
        noteEl.className = "part-note";
        noteEl.textContent = "＊" + noteText;
        info.appendChild(noteEl);
      }
    }
    row.appendChild(info);
    const quote = document.createElement("div");
    quote.className = "quote num";
    quote.textContent = data ? fmt(data.quote) : "—";
    row.appendChild(quote);
    return row;
  }

  function selectModel(item) {
    resultName.textContent = item.model;
    resultBrand.textContent = activeBrand;
    resultParts.innerHTML = "";
    const kind = BRANDS_CONFIG[activeBrand].kind;
    if (kind === "android") {
      ["screen", "battery", "tailplug"].forEach((k) => resultParts.appendChild(partRow(PART_LABELS[k], item[k], ANDROID_REPAIR_TIME[k])));
    } else {
      item.parts.forEach((p) => resultParts.appendChild(
        partRow(p.label, p, IPHONE_REPAIR_TIME[p.label], iphonePartNote(p.label, item.model))
      ));
    }
    resultEl.classList.add("show");
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  searchInput.addEventListener("input", (e) => { query = e.target.value; renderList(); });

  loadAll();
</script>
</body>
</html>
